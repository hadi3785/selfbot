[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# آدرس دیتابیس *اینجا* هاردکد نمی‌شه؛ migrations/env.py اون رو در زمان اجرا
# از bot.db.engine.DATABASE_URL (که خودش از متغیر محیطی DATABASE_URL میاد)
# می‌خونه. این خط فقط برای جلوگیری از هشدار configparser نگه داشته شده و
# مقدارش در عمل نادیده گرفته می‌شه.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
